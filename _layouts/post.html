<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title }} | Field&Associate株式会社</title>
<meta name="description" content="{{ page.excerpt | strip_html | truncate: 160 }}">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.excerpt | strip_html | truncate: 160 }}">
<meta property="og:type" content="article">
<meta property="og:url" content="{{ page.url | absolute_url }}">
{% seo %}
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ffc107'/%3E%3Ctext x='32' y='44' font-family='Helvetica,Arial,sans-serif' font-size='34' font-weight='bold' text-anchor='middle' fill='%2316181d'%3EF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16181d;--ink-2:#4b5563;--ink-3:#9ca3af;
  --bg:#ffffff;--bg-2:#f5f6f8;--line:#e5e7eb;
  --accent:#ffc107;--accent-dark:#e0a800;--accent-ink:#9a6b00;
  --accent-soft:rgba(255,193,7,.16);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
::selection{background:var(--accent);color:var(--ink)}
body{font-family:'Noto Sans JP','Inter',-apple-system,BlinkMacSystemFont,sans-serif;color:var(--ink);background:var(--bg);line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:760px;margin:0 auto;padding:0 24px}

header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 0}
.header-inner{display:flex;align-items:center;justify-content:space-between;max-width:1080px;margin:0 auto;padding:0 24px}
.logo{font-size:20px;font-weight:800;letter-spacing:-.5px}
.amp{color:var(--accent-ink);margin:0 1px}
nav{display:flex;align-items:center;gap:26px}
nav a{font-size:14px;font-weight:500;color:var(--ink-2);transition:color .2s}
nav a:hover{color:var(--ink)}
.btn{display:inline-block;background:var(--ink);color:#fff;font-size:14px;font-weight:700;padding:10px 22px;border-radius:8px;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn-accent{background:var(--accent);color:var(--ink)}
.btn-accent:hover{background:var(--accent-dark)}
@media(max-width:760px){nav a:not(.btn){display:none}}

.post-header{padding:60px 0 32px;border-bottom:1px solid var(--line)}
.post-meta{font-size:13px;color:var(--ink-3);margin-bottom:8px}
.post-title{font-size:28px;font-weight:900;line-height:1.3}
.post-body{padding:40px 0 80px}
.post-body h2{font-size:22px;font-weight:700;margin:40px 0 16px;padding-bottom:8px;border-bottom:2px solid var(--accent)}
.post-body h3{font-size:18px;font-weight:700;margin:32px 0 12px}
.post-body p{margin-bottom:20px;color:var(--ink-2)}
.post-body ul,.post-body ol{margin:0 0 20px 24px;color:var(--ink-2)}
.post-body li{margin-bottom:6px}
.post-body code{background:var(--bg-2);padding:2px 6px;border-radius:4px;font-size:14px}
.post-body pre{background:var(--bg-2);padding:16px;border-radius:8px;overflow-x:auto;margin-bottom:20px}
.post-body pre code{background:none;padding:0}
.post-body blockquote{border-left:3px solid var(--accent);padding:12px 20px;margin:0 0 20px;background:var(--accent-soft);border-radius:0 8px 8px 0}
.post-body img{max-width:100%;border-radius:8px;margin:20px 0}
.back-link{display:inline-block;margin-top:20px;font-weight:600;color:var(--accent-ink)}
.back-link:hover{text-decoration:underline}

footer{border-top:1px solid var(--line);padding:32px 0;text-align:center}
footer small{color:var(--ink-3);font-size:13px}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <a class="logo" href="/">Field<span class="amp">&</span>Associate</a>
    <nav>
      <a href="/#services">サービス</a>
      <a href="/blog/">ブログ</a>
      <a class="btn btn-accent" href="/#contact">相談する</a>
    </nav>
  </div>
</header>

<div class="wrap">
  <div class="post-header">
    <p class="post-meta">{{ page.date | date: "%Y年%m月%d日" }}{% if page.category %} ・ {{ page.category }}{% endif %}</p>
    <h1 class="post-title">{{ page.title }}</h1>
  </div>
  <article class="post-body">
    {{ content }}
    <a class="back-link" href="/blog/">← ブログ一覧に戻る</a>
  </article>
</div>

<footer>
  <small>&copy; Field&Associate Inc. All rights reserved.</small>
</footer>
</body>
</html>
